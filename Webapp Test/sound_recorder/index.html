<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{--text:#fafafa;--accent:#ff4b4b}
body{margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:transparent}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:rgba(128,128,128,.18);border:1px solid rgba(128,128,128,.4);border-radius:8px;padding:6px 10px;cursor:pointer}
button.rec{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
#msg{font-size:12px;opacity:.85;margin:6px 0 0;line-height:1.35}
audio{width:100%;margin-top:6px;height:34px}
</style>
</head>
<body>
<div class="row">
  <button id="rec" class="rec">● Record</button>
  <button id="stop" disabled>■ Stop</button>
  <button id="clr" disabled>✕ Clear</button>
</div>
<div id="msg">Records up to 6 seconds.</div>
<audio id="pl" controls hidden></audio>
<script>
const $ = id => document.getElementById(id);
const send = (type, o = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...o}, "*");
const resize = () => send("streamlit:setFrameHeight", {height: Math.max(125, document.documentElement.scrollHeight + 8)});
const say = t => { $("msg").textContent = t; resize(); };
let mr = null, chunks = [], stream = null, timer = null;

window.addEventListener("message", e => {
  if (e.data && e.data.type === "streamlit:render") {
    const th = e.data.theme;
    if (th) {
      document.documentElement.style.setProperty("--text", th.textColor);
      document.documentElement.style.setProperty("--accent", th.primaryColor);
    }
    resize();
  }
});

$("rec").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (err) {
    say("Couldn't open the microphone: " + err.name + (err.message ? " - " + err.message : ""));
    return;
  }
  chunks = [];
  mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = finish;
  mr.start();
  $("rec").disabled = true; $("stop").disabled = false; $("clr").disabled = true;
  say("Recording… say your warning!");
  timer = setTimeout(() => { if (mr && mr.state === "recording") mr.stop(); }, 6000);
};

$("stop").onclick = () => { if (mr && mr.state === "recording") mr.stop(); };

function finish() {
  clearTimeout(timer);
  stream.getTracks().forEach(t => t.stop());
  $("rec").disabled = false; $("stop").disabled = true; $("clr").disabled = false;
  const full = mr.mimeType || (chunks[0] && chunks[0].type) || "audio/webm";
  const blob = new Blob(chunks, {type: full});
  $("pl").src = URL.createObjectURL(blob);
  $("pl").hidden = false;
  const fr = new FileReader();
  fr.onload = () => {
    const mime = full.split(";")[0];
    const ext = mime.includes("webm") ? "webm" : mime.includes("ogg") ? "ogg" : mime.includes("mp4") ? "m4a" : "wav";
    send("streamlit:setComponentValue", {value: {data: fr.result.split(",")[1], mime, ext}, dataType: "json"});
    say("Saved - this is now your warning sound.");
  };
  fr.readAsDataURL(blob);
}

$("clr").onclick = () => {
  $("pl").hidden = true; $("pl").removeAttribute("src");
  $("clr").disabled = true;
  send("streamlit:setComponentValue", {value: null, dataType: "json"});
  say("Cleared - using the default sound.");
};

send("streamlit:componentReady", {apiVersion: 1});
resize();
setTimeout(resize, 150);
new ResizeObserver(resize).observe(document.body);
</script>
</body>
</html>
